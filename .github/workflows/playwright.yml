# .github/workflows/playwright.yml
name: Playwright Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: UI TESTS
  # ─────────────────────────────────────────────
  test:
    name: UI Test Suite
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.ui_result.outputs.result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create auth directory
        run: |
          mkdir -p playwright/.auth
          echo '{"cookies":[],"origins":[]}' > playwright/.auth/user.json

      - name: Run seed setup
        run: npx playwright test tests/ui/seed.spec.ts
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          SHOPIFY_STORE_PASSWORD: ${{ secrets.SHOPIFY_STORE_PASSWORD }}

      - name: Run UI tests
        id: ui_tests
        run: npx playwright test tests/ui
        continue-on-error: true
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          SHOPIFY_STORE_PASSWORD: ${{ secrets.SHOPIFY_STORE_PASSWORD }}
          CI: true

      - name: Set UI test result output
        id: ui_result
        if: always()
        run: |
          if [ "${{ steps.ui_tests.outcome }}" == "failure" ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
          fi

      # Intermediate artifact — auto-deleted after 1 day, only for report job
      - name: Upload UI allure results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-ui
          path: allure-results/
          retention-days: 1

      # Debug artifact — only on failure, contains screenshots/videos/traces
      - name: Upload UI debug artifacts on failure
        uses: actions/upload-artifact@v4
        if: steps.ui_tests.outcome == 'failure'
        with:
          name: debug-ui-${{ github.run_id }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2: API TESTS
  # ─────────────────────────────────────────────
  api-test:
    name: API Test Suite
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.api_result.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install MCP server dependencies
        run: npm run setup:api-tools

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        id: api_tests
        run: npx playwright test --project="API RUN"
        continue-on-error: true
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          API_TIMEOUT: ${{ vars.API_TIMEOUT }}
          CI: true

      - name: Set API test result output
        id: api_result
        if: always()
        run: |
          if [ "${{ steps.api_tests.outcome }}" == "failure" ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
          fi

      # Intermediate artifact — auto-deleted after 1 day, only for report job
      - name: Upload API allure results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-api
          path: allure-results/
          retention-days: 1

      # Debug artifact — only on failure, contains error logs and traces
      - name: Upload API debug artifacts on failure
        uses: actions/upload-artifact@v4
        if: steps.api_tests.outcome == 'failure'
        with:
          name: debug-api-${{ github.run_id }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/trace.zip
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: COMBINED REPORT + SLACK NOTIFICATION
  # ─────────────────────────────────────────────
  report:
    name: Generate Report & Notify
    runs-on: ubuntu-latest
    if: always()
    needs: [test, api-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Download raw results from both jobs ──
      - name: Download UI allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-ui
          path: allure-results

      - name: Download API allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-api
          path: allure-results

      # ── Restore trend history from gh-pages ──
      - name: Checkout gh-pages for history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Seed Allure history for trend
        run: |
          mkdir -p allure-results/history
          cp -r gh-pages-dir/history/. allure-results/history/ 2>/dev/null || true
        continue-on-error: true

      # ── Generate unified Allure report ──
      - name: Generate Allure report
        run: npm run allure:generate

      # ── Deploy to GitHub Pages (primary) ──
      - name: Deploy Allure report to GitHub Pages
        id: pages_deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          keep_files: false

      # ── Upload as artifact only if Pages deploy failed (fallback) ──
      - name: Upload Allure report artifact (fallback)
        uses: actions/upload-artifact@v4
        if: failure() && steps.pages_deploy.outcome == 'failure'
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report/
          retention-days: 7

      # ── Parse summary for Slack ──
      - name: Parse Allure summary
        id: summary
        run: |
          node -e "
            const fs = require('fs');
            const p = 'allure-report/widgets/summary.json';
            let total=0, passed=0, failed=0, broken=0, skipped=0;
            if (fs.existsSync(p)) {
              const st = JSON.parse(fs.readFileSync(p)).statistic;
              total=st.total; passed=st.passed; failed=st.failed;
              broken=st.broken; skipped=st.skipped;
            }
            const out = \`total=\${total}\npassed=\${passed}\nfailed=\${failed}\nbroken=\${broken}\nskipped=\${skipped}\`;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out + '\n');
          "

      # ── Send combined Slack notification ──
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "Playwright Test Suite Results" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*UI Suite:*                  ${{ needs.test.outputs.result == 'success' && 'PASS' || 'FAIL' }}" },
                    { "type": "mrkdwn", "text": "*API Suite:*                 ${{ needs.api-test.outputs.result == 'success' && 'PASS' || 'FAIL' }}" }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Test Result Summary*" },
                  "fields": [
                    { "type": "mrkdwn", "text": "*Total:*                   ${{ steps.summary.outputs.total }}" },
                    { "type": "mrkdwn", "text": "*Passed:*                    ${{ steps.summary.outputs.passed }}" },
                    { "type": "mrkdwn", "text": "*Failed:*                  ${{ steps.summary.outputs.failed }}" },
                    { "type": "mrkdwn", "text": "*Broken:*                    ${{ steps.summary.outputs.broken }}" },
                    { "type": "mrkdwn", "text": "*Skipped:*              ${{ steps.summary.outputs.skipped }}" }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "style": "${{ (needs.test.outputs.result == 'success' && needs.api-test.outputs.result == 'success') && 'primary' || 'danger' }}",
                      "text": { "type": "plain_text", "text": "📊 View Allure Report" },
                      "url": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "🔍 View Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK